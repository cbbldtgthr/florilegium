[package]
name = "annot-archive"
version = "0.1.0"
edition = "2024"

[dependencies]
base64 = "0.23.1"
clap = { version = "4.6.7", features = ["derive"] }
jiff = { version = "0.2.38", default-features = false, features = ["std", "tzdb-bundle-always"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
toml = "1.1.8"
unicode-normalization = "0.1.26"
uuid = { version = "1.29.0", default-features = false, features = ["v5"] }

[dev-dependencies]
tempfile = "3.27.0"
