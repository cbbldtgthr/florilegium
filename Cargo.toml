[package]
name = "florilegium"
version = "0.1.0"
edition = "2024"
license = "GPL-3.0-or-later"
repository = "https://github.com/cbbldtgthr/florilegium"

[[bin]]
name = "flor"
path = "src/main.rs"

[dependencies]
base64 = "0.23.1"
clap = { version = "4.6.7", features = ["derive", "env"] }
htmlize = { version = "1.1.0", features = ["entities"] }
jiff = { version = "0.2.38", default-features = false, features = ["std", "tzdb-bundle-always"] }
quick-xml = "0.42.0"
rusqlite = { version = "0.41.0", features = ["bundled"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
toml = "1.1.8"
unicode-normalization = "0.1.26"
uuid = { version = "1.29.0", default-features = false, features = ["v5"] }
zip = { version = "9.1.0", default-features = false, features = ["deflate-flate2-zlib-rs"] }

[dev-dependencies]
tempfile = "3.27.0"
